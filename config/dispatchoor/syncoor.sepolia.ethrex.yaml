# Ethrex combinations for Sepolia network
- id: sync-test-sepolia-ethrex-lighthouse
  name: Sync Test (Sepolia) - ethrex/lighthouse
  owner: ethpandaops
  repo: syncoor-tests
  workflow_id: syncoor.yaml
  ref: master
  labels:
    network: sepolia
    el-client: ethrex
    cl-client: lighthouse
  inputs:
    run-timeout-minutes: "2880"
    el-client: '"ethrex"'
    cl-client: '"lighthouse"'
    config: >-
      {
        "network": "sepolia",
        "consensus": {
          "syncType": "checkpoint",
          "nodeType": "fullnode",
          "images": {
            "lighthouse": "sigp/lighthouse:latest"
          }
        },
        "execution": {
          "images": {
            "ethrex": "ghcr.io/lambdaclass/ethrex:latest"
          }
        }
      }

